<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
    <header><h1>Calculadora</h1></header>
    <input type="text" id="display" class="display" value="0" aria-label="Pantalla de la calculadora" readonly>
    <aside class="teclas operaciones" aria-label="Operaciones">
        <button id="btnSuma">+</button>
        <button id="btnResta">-</button>
        <button id="btnMultiplicacion">*</button>
        <button id="btnDivision">/</button>
        <button id="btnIgual" class="igual">=</button>
        <button id="btnLimpiar" class="limpiar" aria-label="Limpiar">C</button>
    </aside>
    <main class="teclas numeros" aria-label="Números">
        
        <button id="btn1">1</button>
        <button id="btn2">2</button>
        <button id="btn3">3</button>
        <button id="btn4">4</button>
        <button id="btn5">5</button>
        <button id="btn6">6</button>
        <button id="btn7">7</button>
        <button id="btn8">8</button>
        <button id="btn9">9</button>
        <button id="btn0">0</button>
    </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
